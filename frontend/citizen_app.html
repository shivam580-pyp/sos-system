<!DOCTYPE html>
<html lang="hi" class="h-full bg-slate-900 text-slate-100 selection:bg-red-600 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDRF All-India Citizen Emergency SOS App</title>

    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased pb-20">

<!-- App Header -->
<header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-40 shadow-xl flex flex-wrap justify-between items-center gap-2">
    <div class="flex items-center space-x-2">
        <span class="bg-red-600 text-white font-black text-xs px-2.5 py-1 rounded-lg tracking-widest shadow">NDRF INDIA</span>
        <div>
            <h1 class="text-sm font-bold leading-tight">NATIONAL CITIZEN SOS</h1>
            <p class="text-[10px] text-emerald-400 font-mono flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="txtNetStatus">Online API & BLE Mesh Sync</span>
            </p>
        </div>
    </div>

    <!-- Navigation & User Auth Status -->
    <div class="flex items-center space-x-2">
        <div id="userAuthBadge"></div>
        <a href="/command_center.html" class="bg-sky-700 hover:bg-sky-600 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg border border-sky-600">
            🚤 Command Center
        </a>
        <select id="langSelect" onchange="changeLanguage()" class="bg-slate-900 text-slate-200 text-xs px-2 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:ring-1 focus:ring-sky-500 font-medium">
            <option value="hi" selected>हिन्दी</option>
            <option value="en">English</option>
            <option value="ta">தமிழ்</option>
            <option value="te">తెలుగు</option>
            <option value="kn">கன்னட</option>
            <option value="ml">മലയാളം</option>
            <option value="mr">मराठी</option>
            <option value="gu">ગુજરાતી</option>
            <option value="as">অসমীয়া</option>
            <option value="bn">বাংলা</option>
            <option value="ne">नेपाली</option>
        </select>
    </div>
</header>

<!-- Main Mobile App Container -->
<main class="flex-1 max-w-md mx-auto w-full p-4 space-y-4">

    <!-- PWA Install Banner -->
    <div id="pwaBanner" class="bg-sky-950/80 border border-sky-700 p-3 rounded-2xl flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-2.5">
            <span class="text-2xl">📲</span>
            <div>
                <h2 class="text-xs font-bold text-sky-200" id="txtPwaTitle">फोन में ऐप इंस्टॉल करें</h2>
                <p class="text-[10px] text-sky-300" id="txtPwaDesc">बिना इंटरनेट (Offline) आपात स्थिति में चलाने के लिए</p>
            </div>
        </div>
        <button onclick="promptPWAInstall()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow">
            Install
        </button>
    </div>

    <!-- SOS TRIGGER SECTION -->
    <section id="tabSos" class="space-y-4">
        
        <!-- Live GPS & Status Card -->
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700 flex justify-between items-center text-xs">
            <div>
                <span class="text-slate-400 block text-[10px]" id="txtGpsLabel">वर्तमान GPS स्थान:</span>
                <span id="gpsCoords" class="font-mono font-bold text-sky-400 text-xs">GPS प्राप्त हो रहा है...</span>
            </div>
            <button onclick="fetchGPSLocation()" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 px-2.5 py-1.5 rounded-xl border border-slate-600">
                🔄 Refetch
            </button>
        </div>

        <!-- Emergency Situation Selector -->
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-2">
            <label id="lblCondition" class="block text-xs font-bold text-slate-200">आपकी आपातकालीन स्थिति चुनें:</label>
            <select id="sosCondition" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-red-500 font-medium">
                <option value="FLOOD_TRAPPED">🌊 बाढ़ में फंसे हैं / छत या पेड़ पर हैं (Trapped in Flood)</option>
                <option value="CYCLONE_CRITICAL">🌪️ चक्रवात / तूफान क्षति (Cyclone / Storm Emergency)</option>
                <option value="EARTHQUAKE_COLLAPSE">🏚️ मलबे/इमारत में फंसे हैं (Earthquake / Landslide)</option>
                <option value="MEDICAL_CRITICAL">🚨 गंभीर मेडिकल इमरजेंसी / चोट (Medical Emergency)</option>
                <option value="INFANT_ELDERLY">👶 नवजात शिशु / बुजुर्ग का तत्काल रेस्क्यू (Infant/Elderly)</option>
                <option value="NEED_FOOD_WATER">🍞 भोजन और पीने के पानी की सख्त जरूरत (Food/Water Needed)</option>
                <option value="SAFE_RELOCATED">🟢 सुरक्षित स्थान पर पहुँच गए (Safe Signal)</option>
            </select>
        </div>

        <!-- MAIN 1-TAP SOS BUTTON -->
        <div class="relative flex justify-center py-2">
            <button id="sosBtn" onclick="sendSOS()" class="w-full max-w-xs bg-gradient-to-b from-red-500 to-red-700 hover:from-red-600 hover:to-red-800 active:scale-95 text-white font-black text-3xl py-10 rounded-3xl shadow-2xl shadow-red-900/80 border-4 border-red-400 flex flex-col items-center justify-center transition-all">
                <span id="txtSosBtnMain">1-टैप SOS</span>
                <span class="text-[11px] font-normal mt-1 opacity-90 text-red-100" id="txtSosBtnSub">NDRF HQ & Command Web Sync</span>
            </button>
        </div>

        <!-- PHYSICAL ALERT TOOLS -->
        <div class="grid grid-cols-2 gap-3">
            <button id="sirenBtn" onclick="toggleWhistleSiren()" class="bg-slate-800 hover:bg-slate-700 active:bg-red-600 text-white p-4 rounded-2xl border border-slate-700 flex flex-col items-center justify-center text-center space-y-1 transition shadow-lg">
                <span class="text-2xl">🔊</span>
                <span class="text-xs font-bold" id="txtWhistleBtn">2800Hz सीटी साइरन</span>
                <span class="text-[9px] text-slate-400">रेस्क्यू कुत्तों/टीम के लिए ऑडियो</span>
            </button>

            <button id="strobeBtn" onclick="toggleStrobeBeacon()" class="bg-slate-800 hover:bg-slate-700 active:bg-amber-600 text-white p-4 rounded-2xl border border-slate-700 flex flex-col items-center justify-center text-center space-y-1 transition shadow-lg">
                <span class="text-2xl">🔦</span>
                <span class="text-xs font-bold" id="txtStrobeBtn">स्क्रीन फ़्लैश लाइट</span>
                <span class="text-[9px] text-slate-400">रात में हेलीकॉप्टर / नाव संकेत</span>
            </button>
        </div>

        <!-- Broadcast History Log Card -->
        <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700 space-y-2">
            <h3 class="text-xs font-bold text-slate-300 flex justify-between items-center">
                <span id="txtLogTitle">📡 हालिया SOS सिग्नल लॉग (Server Sync)</span>
                <span id="logCount" class="text-[10px] bg-red-950 text-red-400 px-2 py-0.5 rounded-full border border-red-800">Active Node</span>
            </h3>
            <div id="sosLogContainer" class="space-y-1.5 max-h-36 overflow-y-auto text-[11px] text-slate-400">
                <p class="text-center py-4 text-slate-500">अभी तक कोई SOS सिग्नल नहीं भेजा गया है।</p>
            </div>
        </div>

    </section>
</main>

<!-- JS Scripts -->
<script src="/js/auth.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/ndrf_directory.js"></script>
<script src="/js/mesh_network.js"></script>
<script src="/js/citizen_app.js"></script>

</body>
</html>
